[project]
name = "callme-tmp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.23.0",
    "llm-sdk",
    "numpy>=1.26.0",
    "pydantic>=2.13.4",
    "torch>=2.13.0",
    "transformers>=5.13.0",
]

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true, editable = true }

[tool.mypy]
python_version = "3.12"
strict = true

python_executable = ".venv/bin/python"

[[tool.mypy.overrides]]
module = ["llm_sdk", "llm_sdk.*"]
ignore_errors = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pydantic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "mypy>=1.10.0",
    "flake8>=7.0.0",
]
